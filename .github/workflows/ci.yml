name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + unit tests + core MCP contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Require/load every MCP tool
        run: npm run check
      - name: Unit tests (offline)
        run: npm test
      # The MCP contract trained-assist-agent's deploy.sh checks before it moves this
      # sibling checkout in prod.
      - uses: actions/checkout@v4
        with:
          repository: trained-assist/trained-assist-agent
          path: .core
      - name: Core MCP contract (deploy gate)
        run: node .core/scripts/check-mcp-conformance.js .
      # This repo owns the Customer Development playbook; a file that drifts from the
      # Playbook v1 contract is silently dropped at resolution time, so check it here.
      - name: Playbook v1 contract
        run: node scripts/check-playbook-contract.js
      # Valid is not enough: the prompt route must lead the agent to
      # playbook_run(<id>) from a plain request. --strict = the customer-development.md
      # pointer must stay.
      - name: Playbook reachability («доехал ли плейбук»)
        run: node .core/scripts/check-playbook-reachability.mjs --repo . --all --strict
